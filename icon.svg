<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GoldHub logo">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Coin -->
  <circle cx="32" cy="32" r="28" fill="url(#coinGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
  <!-- Letter G -->
  <path d="M37 24a9 9 0 1 0 0 14" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37 24h5v5" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
